name: AFF isolated financial tests
on:
  workflow_dispatch:
  push:
    branches:
      - fix/aff-financial-authorization
permissions:
  contents: read
jobs:
  financial-tests:
    if: github.ref == 'refs/heads/fix/aff-financial-authorization' && github.event.repository.private == false
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install isolated compiler
        run: npm install --no-save --package-lock=false --ignore-scripts --no-audit --no-fund typescript@5.6.3
      - name: Financial security
        run: node scripts/financial-security-tests.mjs
      - name: Subscription entitlement
        if: success() || failure()
        run: node scripts/subscription-entitlement-tests.mjs
      - name: Renewal integration
        if: success() || failure()
        run: node scripts/renewal-integration-tests.mjs
      - name: Affiliate commission
        if: success() || failure()
        run: node scripts/affiliate-commission-tests.mjs
      - name: Affiliate referral
        if: success() || failure()
        run: node scripts/affiliate-referral-tests.mjs
      - name: Affiliate reversal
        if: success() || failure()
        run: node scripts/affiliate-reversal-tests.mjs
      - name: Affiliate payout
        if: success() || failure()
        run: node scripts/affiliate-payout-tests.mjs
      - name: Transaction matching
        if: success() || failure()
        run: node scripts/financial-reconciliation-tests.mjs
      - name: Discrepancy detection
        if: success() || failure()
        run: node scripts/financial-discrepancy-tests.mjs
      - name: Financial reporting
        if: success() || failure()
        run: node scripts/financial-reporting-tests.mjs
      - name: Audit export
        if: success() || failure()
        run: node scripts/financial-audit-export-tests.mjs
